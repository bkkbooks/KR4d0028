body:
  text: 徂徠集卷八宋石介撰雜文貴謀天下有大憂危國家有大菑患聖賢發至誠運至智定至謀以扶安之聖賢之誠誠矣聖賢之智明矣聖賢之謀果矣如機之發如蓍之占如節之合作於此而應於彼言於近而驗於逺不差毫釐噫聖賢之謀必行則自古無喪身無敗家無亡國無傾天下喪身敗家亡國傾天下由聖賢之謀不用也桀從伊尹之謀安有南巢之放紂從比干箕子之謀安有太白之誅項從范增之謀安有楚江之亡漢從劉向之謀安有王氏之篡唐髙祖從遂良之謀安有武氏之禍明皇從九齡之謀安有祿山之難陳不從泄冶之謀故亂晉不從宣子之謀故殺虞不從宫之竒之謀故亡秦不從蹇叔之謀故喪殽函之師趙不從藺相如之謀故失長平之衆成安君不從廣武之謀故死汦水之上漢髙皇不從建春之謀故困平城之中堯能用舜禹之謀是以光宅天下舜能用夔契之謀是以濬哲文明禹能用益稷之謀是以祇承湯能用伊尹之謀是以克夏文武能用吕望周召之謀是以革商髙祖能用三傑之謀是以有漢惠帝能用子房之謀是以定位光武能用耿鄧之謀是以復乃堂構劉備能用葛亮之謀是以撫有巴蜀文帝能用髙熲之謀是以創始有隋太宗能用房杜之謀是以光亨於唐梁公之謀行則李氏再祀姚宋之謀行則開元升平裴度之謀行則元和靖武大哉聖賢之謀至矣用之則生不用則死用之則存不用則亡死生存亡大矣彼不能用愚暗甚矣嗟乎救說道大壞由一人存之天下國家大亂由一人扶之周室衰諸侯亂道大壞也孔子存之孔子沒楊墨作道大壞也孟子存之戰國盛儀秦起道大壞也荀况存之漢祚微王莽篡道大壞也楊雄存之七國弊王綱隳道大壞也文中子存之齊梁以來佛老熾道大壞也吏部存之管蔡之亂則周公扶之也諸吕之亂則周勃扶之也江左之亂則謝安扶之也武氏之亂則梁公扶之也祿山之亂則汾陽扶之也朱泚之亂則西平扶之也淮西之亂則晉公扶之也五代之亂則太祖扶之也故道卒不壞天下國家亂卒止古之人有言曰大厦將顛非一木所支是棄道而亡天下國家也孔子曰危而不持顛而不扶則將焉用彼相易大過上六滅頂凶無咎以救衰拯弱也大厦將顛一木柱之或得不顛顧顛而不支坐而俟其顛斯亦為不智者矣道將大壞天下國家將大亂而不救坐視其壞亂斯亦不仁者矣大凡聖人之道有菑害以身當之賢人之分也天下國家有患難以死殉之忠臣之節也而曰見可而進量力而動其全身茍生者歟責臣大過上六君子矣心在救時至於滅頂凶而無悔且當棟撓之世居無位之地而過涉以扶衰拯弱可謂君子矣今國家有西北邉之憂聖君夙夜勤勞日旰不食重擇大臣付以專征大官以寵之富祿以厚之節旄以崇之宜竭智力以幹乃任盡謀策以濟厥事智力竭矣謀䇿盡矣然後以死繼之可也乃偃蹇君命優遊私家謂聞金鼓之震天下不若聞絲竹之淫耳謂見羽旄之翳目不若見趙魏之侍前謂若被甲胄不若服輕紈謂若冒矢石不若御重裘不竭智力不盡謀䇿乃稱才不稱任飲食加多筋力完壯乃謂病不任事上以罔於君下以欺於人以圗其身之安噫國家宴安無事爾相爾公爾侯貪榮取寵不知休止聚財積貨不知紀極飽而嬉醉而眠間則陳功勞叙閥閲矜材能薦智略恨爵位之不髙任使之不先曾不曰才不稱任病不任事國家一日有邉鄙之憂聖君倚之以安而曰臣病臣不才至於兩銓三班院除人往西北邉云多不肯行嗚呼食人之祿死人之事况聖君英威睿武仁行如春義行如秋敢茲不肅是臣得以慢君君不能以使臣也天子之命豈可行乎傳曰四郊多壘卿大夫之辱也又曰主憂臣辱大官以被其身富祿以厚其家四郊多壘則曰非我之辱也主憂則曰非我之事也有官責而不勤其官矧在於無位之地乎吾是以責斯人而賢上六也嗚呼賴聖君洪覆如天不以置諸法若有如孔子者出則當以春秋亂臣同誅矣録微者言曉鼓後諸曹既抱書退公舍岑寂如私庭焉日將曛豫中榻坐軒窗下有府吏職執法丁其姓簡其名者袖短幅急馳而來授於豫且曰天子念東南之民薦罹饉饑渙然散汗漫之澤除其田租以緩民命順氣和聲油然向令然鄉墅有不占田之民借人之牛受人之土傭而耕者謂之客戶人嵗輸其緡錢數百於有司以其不地而征無名而取謂之乾食鹽錢比民年豐尚不逃饑與寒嵗凶穀價髙朝夕且恐死乃不得與占田之民同除其賦官人幸有位亦嘗聞孳孳有濟蒼生之心豈能書其事馳聞於天子之庭乎介矍然而駭悚然而恭抗聲大叫語其人曰此衣食天子者之所宜思也牧養天子之民者之所宜憂也刺史巖巖坐於堂縣令申申處其家庶臣晏然髙枕而卧使臣喧譁攬轡而馳曾不及是思曾不及是憂爾何人思及是吾徒食而魚出而車朝服逶迤處爾之上亦何施其面目哉豫將傳爾言達於上傳曰詢于芻蕘又曰狂夫之言聖人擇焉嘉其人有所興起座有筆硯因書之牘背云辨私儒者好稱說孔子之道非大言也非私於其師之道也孔子之道治人之道也一日無之天下必亂如粟米不可一日少少則人饑如布帛不可一日乏乏則人凍死孔子之道君臣也父子也夫婦也朋友也長幼也天下不可一日無君臣不可一日無父子不可一日無夫婦不可一日無朋友不可一日無長幼萬世可以常行一日不可廢者孔子之道也離孔子之道而言之其道雖美不致於逺其言雖切無補於用猶錦繡不可以待寒珠玉不可以療饑故儒者稱說不及焉非遺之也書淮西碑文後淮西之賊五十年王師屢戰無功天下之兵百十萬之將過時不下天啓神算以授裴度度克恭行天罰以夷不靖度建大謀以任李訴訴克先登賊城以殱元凶淮西以平蔡人以生天人相與乎君臣協心乎上下同力乎推其用則度得天也訴得人也計其功則度任智也訴任力也曰燥者曰潤者人止知其風雨也曰生者曰成者人止知其春秋也然不動而運其用者天也曰戰者曰勝者人止知其訴也光顔也重裔也然無為而任其謀者度也漢髙帝取天下蕭何無汗馬之勞韓信攻必取戰必勝曹參身被七十創而功居何次豈不曰發蹤指示者人也追殺獸者狗也度與訴之功亦猶是乎文公豈昧此者辭於碑優度功誰曰不實也初度輔政以郡賊未除亦延接竒士共為籌畫乃請於私第接延賓客自是天下賢俊得以效計議於丞相則取蔡之謀已落於彀中矣諸將連年出兵玩冦相視持以嵗月未有成功而羣臣皆欲罷兵度獨倡堅議與上協心計定意斷衆不能破請身自督戰且曰誓不與此賊偕全則得勝之算已運於掌上矣及至郾城巡撫諸軍宣達上㫖士皆賈勇時諸道兵皆有中使監之軍陳進退不由主帥勝則先使獻捷偶衄則凌挫百端度至行營並奏去其柄專制之於主將衆皆喜悅軍法嚴肅號令畫一則將軍之令專行於閫外矣以天下取蔡之謀掌上得勝之算閫外將軍之令合而用之一而行之易曰師貞丈人吉有不利乎七月度出十月賊平成天下之務通天下之志不疾而速不怒而威非惟幾惟深惟神其孰能與於此乎故曰度得天也其功無敵於天下矣責素餐狗當吾戶猫捕吾鼠雞知天時有功於人食人之食可矣犀象麋鹿鸚鵡鷹鶩無功於人而食人之食孟子所謂率獸而食人也噫無功而食禽獸猶不可彼素餐尸位將狗猫雞之不若乎辨謗介讀青州劉槩韓吏部傳論曰憲宗迎佛骨羣臣無敢言者獨吏部論之走南荒八千里此豈利於身利於道也介於此知吏部之功也潮陽之湫鱷魚為害潮人患之吏部至投文以逐之一夕盡去鱷魚厥性暴戾無識猶感其化而去焉使吏部立巖廊輔元首施其道而化天下之暴戾無識復有如鱷魚者乎必無者也鱷魚可化况於人乎介於此知吏部之道也曰史臣謂公排釋老於道未大不知大其道者復何也介於此知吏部之尊也曰諱辨其㫖不獨為賀也有激於時爾凡人怠於敦孝而亟於避諱甚無取也介於此知吏部之孝也曰鯀無德於民猶有靈於晉國宗元有德於民豈無靈於羅池者乎吏部碑之何所不可介於此知吏部之是也曰平蔡碑非不善也信一婦人而磨之焉知實録不類碑介於此知吏部之受誣也則是吏部之誣由槩而釋吏部之道由槩而明槩亦可稱為端直良士天聖四年秋詔郡國舉進士時故諫議大夫滕公涉守青州謂槩能明吏部之道特為首送槩少則為古文專意聖人之道性僻野以介特自守常居深山中或逾年一下山未嘗一造權豪門先兩為青州舉送以是名字不得髙至是首送青人皆大怒滕之所為以滕不知人或謂槩有化丹砂為黃金術滕意得之特為首送或以為槩得當塗力故得首送滕於是被此謗已八九年矣介昨日架上整亂書得槩韓吏部傳論讀之知吏部之大道知槩之名不虛得知滕之被謗噫吏部之道二三百年得槩則伸之劉槩之名二三十年得滕公發之滕公之謗八九年得石介明之故作辨謗云朋友解姜潛至之被水害苦甚奉符縣尉李緼仲淵與至之交且通家義甚厚濟至之之困災為借力營救之或以私役之人罪之察盜賊捍水火縣尉之職也又朋友之義也患難相恤緼得其職又得朋友之義反得罪大懼朋友之道絶因解之夫父子兄弟以親愛君師朋友以義合也入則事父兄出則事君師朋友君臣之際猶有爵祿焉師友之分非道義不合夫所謂道者親而不可離者也夫所謂義者合而不可解者也古之管仲鮑叔王陽貢禹以義始而以義終者也張儀蘇秦陳餘張耳以利始而以利終者也義無不克終利無有克終今夫人之趨權利熱則蜂來寒則鳥去平生握手把酒叙歡欣肝膽吐在地一旦急難危患則掉臂緩趨而過若越人視秦人之疾不獨不一顧又從而排陷之朋友之道薄也如此有人反其薄而就於厚則以為罪今奉符縣尉李緼與進士姜潛同師受業有升堂拜母之義潛居奉符之太平鎮今嵗夏六月七日乙夜水大至太平之人死者五人其一則𣙜酒使臣張借職也在太平三四百家濳被水尤苦夜風雨震電天大黑水且暴來濳左手扶老母右手扶嬰兒妻子弟妹纍纍隨其後出沒於水中僅得脫死走太平四里餘就髙阜以避濳之居廬邸店并其所以待嵗時佐伏臘之用幾百萬與所藏書數千卷盡為水害緼於濳交義甚厚濳之患難不細緼不足為有勢力可以庇濳而操本縣尉權略足以施於濳倘更退顧其身愛惜礙國家禁茍逃錙銖罪不為濳致毫髮力思晏安坐視此誠無知禽獸之不為也東家火西家焦髮爛額為撲滅赤子入井路人不弛負擔匍匐走救之濳之水甚於東家火也濳之將至於死猶赤子之入井也緼少被仲兄故龍圖之教長師泰山孫明復先生及親慕士建中而交石介識周公孔子之道知仁義忠信且與潛交厚反顧身愛惜乃不如無知禽獸乎不如西家路人乎以古朋友之道責之緼猶負大罪潛之窮且困如此才能借九日力遺一囊麵未足以解潛昏墊之災然以今人推之緼能不退顧其身愛惜其官抵冒刑禁以濟夫朋友危患是能以義始終者也故舊不遺者也患難相恤者也法網凝密乃籠緼而繩之以微文置之於深典此不惟傷朋友之道亦以害國家教化之本國家設禁所以禁小人非施之於君子也小人大為之禁亦或喻之君子則有禮樂而已矣使緼狥國家之常禁則廢朋友之大義禁者權也權者有時而用制小人不以權則壞法亂民為害必滋義者常也常者道之中也中常用待君子不以中是示天下無君子矣緼為君子而以小人制之豈其宜也緼亦不足深惜惜夫朋友之道遂絶矣天下風俗更薄矣噫州縣吏貪墨殘毒者滿目曾不聞罪一人緼奉公守法緼特愛民緼有文行緼有節義緼孝以事親緼忠於事上緼信於朋友反得罪悲夫辨惑吾謂天地間必然無者有三無神仙無黃金術無佛然此三者舉世人皆惑之以為必有故甘心樂死而求之然吾以為必無者吾有以知之大凡窮天下而奉之者一人也莫崇於一人莫貴於一人無求不得其欲無取不得其志天地間茍所有者惟不索焉索之莫不獲也秦始皇之求為仙漢武帝之求為黃金蕭武帝之求為佛勤已至矣而秦始皇帝逺逰死蕭武帝餓死漢武帝鑄黃金不成推是而言吾知必無神仙也必無佛也必無黃金術也徂徠集卷八
