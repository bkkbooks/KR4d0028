body:
  text: 徂徠集卷四宋石介撰近體詩讀安仁學士詩曼卿舊字安仁齊梁無駿骨李杜得秋毫後世益纂組變風堪鬱陶奔道少驥逸充棟如牛毛試看安仁詠秋風有怒濤寄雷澤張從道不知有凍死一室心恬如臘盡妻未褐天寒子讀書澆風與世薄古道於時踈事事皆同我憶君春草初竹書筒二首截竹功何取為筒妙可談長猶不盈尺青若出於藍浮薄瓤皆去嶔崟節獨堪誰言但空洞自是貴包含虛受殊招損多藏不類貪巾箱經漫五謗牘篋空三淚有湘妃灑書疑禹穴探質曾冒霜雪價本擅東南隕籜遺輕粉移根破凍嵐龍吟終不死鳯實尚餘甘朴陋我為貴雕鎪彼合慙居常置几案出或係騑驂唱和友朋倦提攜童僕諳純姿斥丹漆美幹敵楩柟其直如周道虛心學老聃吾徒正得用詩筆戰方酣又達者創竒製雙魚斷竹尋蒼琅破雲色蕭瑟移風音徑寸不為短探幽乃覺深中間自空洞枝幹何􅋂崟投恐成龍去吹還作鳯吟稜稜人有節竅竅物無心儉朴功難比提攜力易任純姿古皇道虛受聖人經或貯諫官草多收女史針筒兮用可貴吾不換南金訪田公不遇主人何處去門外草萋萋獨犬睡不吠幽禽間自啼老猿偷果實稚子弄鋤犁日暮園林悄春風吹藥畦蘇唐詢秀才晚學於豫告歸以四韻勉之憐我山中卧半年相伴吟道傳諸子後易得數爻深㸑或經年絶書猶盡日尋惜哉未終業親老忽沾襟獵騎士千人集綏旌四面張凝隂慘羣物殺氣結飛霜雉守一節死兔緣三穴藏石慙羊質見狐嘆虎威亡獸困猶思鬭鴻驚不亂行惟當縱猛鷙盡使食貪狼意務除田害誰言事外荒非熊得吕望祝網遇成湯近念魏知古深思夏太康吾君戒馳騁凡事合經常大寒早行萬動皆休迹五更獨鳴鞭星霜結凄色風霰過長川草暖犬猶睡河氷馬不前城牆多有穴林屋半無煙餓虎寒猶吼妖狐怪不眠山空亂猿叫樹折一雞顛幾處爐薰炭何人坐有氊﨑嶇轉行路凛冽逼窮年腳指兩箇落衫裳百孔穿噓唏鼻才潤僵直手難拳身固凍不死老當窮且堅四方丈夫事誰為淚潺湲逰虛泉山寺寺逺離朝市同逰並結軨階根盤石磴殿影落青冥地勝松筠衆山名草藥靈洞門深數里檜樹夀千齡疑有神仙聚寧容魑魅停年多養龍虎早已蟄雷霆石上生苔蘚岩阿長茯苓晴雲出幽竇隂霧滑疏櫺露滴茶芽潤煙蒸竹汗青餐霞充道味採术驗丹經直擬升髙處何妨陟絶陘遐觀際寥廓下視何羶腥自被利名染無因肺腑醒晨興看案牘夜坐守窗螢齪齪遵前訓兢兢視此銘沉冥若籠鳥囚係似拘囹有願棲雲壑相隨步翠坰平生山野性暫喜據梧瞑至日早離張村北闕千官集南山萬夀長何人踐文石獨客踏寒霜指凍且憂落馬羸時恐僵豐凶卜來嵗猶喜矞雲黃嵗晏村居嵗晏有餘糧杯盤氣味長天寒酒腳落春近臛頭香菜色青仍短茶芽嫩更黃此中得深趣真不羡膏粱病起吟殘菊病起重陽過東籬菊尚黃殷勤擷寒蕊仔細嗅清香老梗防間蝶清油護曉霜叢邉強一酌聊不負秋光和馬寺丞秋日寄明復先生秋隂間秋色何處動悲涼有叟傅岩隱明時皤鬢蒼殘書幾篋蠧寒菊半籬荒惟學春秋者時時到草堂嶽色春近滿魯甸雨餘堆汶河濃雲映不盡殘照射來多髙與天垂野間臨月上波特開西北户愛此鬱嵯峨宿村舍明道癸酉嵗去去都城逺蕭蕭村落稠飢鴟啄死鹿鳴犢隨孳牛轉徙多空屋荒榛有亂丘狐狸競恐怖雀鼠仍啁啾鬼火時明滅旋風乍卷收吾心不吐茹忠信待姦仇和奉符知縣馬寺丞永伯捕蝗回有作天道不可詰吾當責爾螟方今絶讒慝何故播羶腥野草離離盡秋禾穗穗零知君恤民意鬢滅數莖青泰山七百里魯甸北瞻何巖巖諸山知峻極五嶽獨尊嚴寰宇登來小龜蒙視覺凡此為羣物祖草木莫鋤芟留守待制視學藝祖興王地諸侯布教宫冠纓臨仗集文雅與時隆泮水差差緑春芹習習風袍輝子襟動旗映講紗紅節鉞來門外聲容播國中分庭等威殺更僕宴談終亹亹聞諄誨拳拳激懦衷武昌尊庾亮蜀郡樂文翁王化周南始儒縫魯俗通四方觀表則後學發童蒙木鐸留遺韻緇衣纘舊功願公持此道黃閣弼清躬其二演道開談席觀文降使轓水寒芹葉薄春早杏隂繁喜動青青佩親聞亹亹言孤生荷樂育終始託丘園其三開府雍容甚輕裘博雅存席間間布帙鈴下晝無喧首喜隆儒術諸生接討論馬融南郭學齪齪豈堪言其四春早沂風暖芹生泮水深前旌拂講樹垂佩耀青襟郁郁彌文化循循善誘心恭王不壞宅金石有遺音其五翼翼取則地菁菁樂育篇使轓臨學舍台席俯談筵韋相傳經舊文翁倡教先諸生動觀嘆門外卓卿旃其六泮水緑猶淺春芹葉始敷旌旗久停駐襟佩儼相趨庾亮親臨學哀公不詬儒茲為表則地風教自王都寄趙庶明推官四十年來贊太平君王耳畔管簫聲定襄地域俄聞震萊牧男兒忽議兵明日邉烽髙百丈同時御府出三旌將軍請用多多算能向當初見未萌寄沛縣梁子髙南海怒蛟三尺角埋藏水底嘆吟呻明時直道難干祿白首躬耕力養親醉讀兵韜鬭龍豹間抽寶劒舞星辰官齋東是留侯廟定有英靈還往頻送殿院還臺老柏森森節貫冬頭冠獬豸號清雄側階簪筆書王法當路埋輪有祖風白簡剛嚴重入府皂封切直舊留中長安豪貴應相避又識當年御史驄徂徠山齋熟寢家童報征西府從事田集賢元均張著作與文趙推官庶明書至開緘讀之因題書後滿徑蓬蒿懶自鋤何人日午叩茅廬徂徠山下一枕睡經略府中三紙書兵謀貴勝縱橫出海鳥忘機飲啄餘惟有華夷雅頌作文章兼不讓當初元均首登賢良科因寄宏辭等甲賢良貴二美翩翩落個中今之御試用三題即唐宏辭科也虎子得來山穴泣驪珠探去海濤空三千字獨陳當寧十七人甘坐下風試者十八人曾向當年競頭角直從此日決雌雄豫與元均同年登進士科禮部御前姓名皆相鄰安道再登制科雄辭磅礴壓羣英再戰戈矛鋭更精裴度韜鈐無失律武侯節制是神兵千人盡服徂共議九合誰干小白盟帝宋開基八十載連登科目獨為榮送奉符監酒稅孟執中借職蜀主之後東西兩處各天涯去國還鄉喜又嗟鄒嶧山藏孟子宅自言孟軻後海棠花落蜀王家深知周道非彛酒可罪唐臣乞稅茶三載此心無一事聞經絳帳日常斜事退日就孫明復先生問道嘉州讀邸報見張叔文由御史臺主簿改著作佐郎依舊在臺驚聞除目到遐荒病眼偏明喜倍常古節如爭臺柏直青衫新惹閣藝香中廬夜宿羣經蠧北户朝趨滿簡霜主簿雖卑官漸緊近來應有諌書囊豫與元均永叔君謨同年登科永叔尋入館閣元均今制䇿髙第君謨後磨勵元均事業獨豫駑下因寄君謨網羅當日得英雄文陳三人各立功海裏赤鯨疑有角雲中騏驥欲追風尋聞館閣英聲出又見賢良大對通亦説年來畜竒業蟭螟何計逐飛鴻赴任嘉州初登棧道寄題薑潛至之讀易堂我不從官君下第其間險易兩何如連雲棧外四千里讀易堂中一帙書慈母含飴垂禿髮先生懷道接茅廬莫將清淚頻頻灑蜀道之難欲上初入蜀至左綿路次水軒暫憩水軒聊得恣吟哦拂拭衣裳塵土多蜀道三千里巇險官途五十驛風波暫休又作故山夢間唱還成勞者歌幾斗米牽歸未得空憐滿眼是煙蘿寄叔文幾年持筆事征西未省尊前略展眉草檄朝慵腕勞脫論兵夜苦舌瘡痍報君自説心如石憂國人言鬢欲絲若紀成功鏤金板能文韓愈自相隨左綿席上呈知郡王虞部王與介前任同在睢陽何事相逢悲喜并倐然相别二周星主人鬢髮無多白幕府藍衫依舊青目極同思故山斷涕洟共在異鄉零階前絲竹雖嘈雜不似南湖湖上聽睢陽南湖宴遊之所也嘉州寄左綿王虞部江山如畫望無窮况屬升平嵗屢豐萬樹芙蓉秋色裏千家砧杵月明中斷霞半著燕支木零露偏留筀竹叢只欠流杯曲水宴風流未與左綿同左綿新創流杯士廷評相會梓州道視荀揚雖未至分於管鮑已知深一千二百日離别五十六驛外相尋重欲同君注周易且來共我聽胡琴月留屋角不下去似與清風憐苦吟鄭師易秀才詩奔騰遒壯殆有石曼卿學士風骨作四韻以勉之曼卿續得少陵絃絃絶年來又一年驚起聽君諷新句灑如開集味遺篇一家氣骨疑無偶萬丈光芒欲拂天好向風騷尤著意他時三箇地詩仙送李堂伯升病歸經年玄圃採珠璣無限愁腸對落暉緑竹實疏鳯凰瘦玉芝粒小麒麟飢不因勞草傷春哭正是飄蓬感疾歸只有文章滿君腹身雖癯瘠道全肥伯升病歸君逢遵道送歸朝來何事苦顰眉一客越吟三子歸河渚徘徊感春草山齋寂寞背斜暉知心古道誰相得灑淚東風自覺非早到茅廬慰孤淡易爻重待共參微喜雨學作升平喜雨吟東臯微破滿犁深已聞萬乘焦勞慮應解三公燮理心天捉乖龍鞭見血雷驅和氣泄為霖農夫隴上間論價一寸甘膏一寸金留題敏夫隱居三回到此尋逋客杯案蕭疏氣味長午飯半甌橡子熟春蔬一筯术苗香四時泉石應無夏滿谷雲霞别是鄉終待共君結鄰里竹邉相並兩間房訪竹溪呈孟節兼有懷熙道到頭泉石是吾家坐石聽泉日已斜一片青衫非富貴千竿緑竹好生涯君曾覽照頭皆雪我試看書眼亦花便好結為山伴侣教他夔益佐勳華招張洞明道君言下第我西飛執手都門淚滿衣萬里得歸頭半白經年相别道應肥火鑽欲遍龜難死竹實猶多鳳不飢暫到東山慰愁抱春秋之學説深微攝相惜無百里地封君攝相區區道屢伸少正將身膏斧刃侏儒流血汙車輪方令魯國知王法自此齊侯畏聖人昔放四凶誅二叔舜周功業始同倫寄孔中丞諌署崢嶸有舊名侯藩偃息政方成張綱昨日彈梁冀文帝今朝召賈生古節未慙臺柏直仙風應對簡霜清人言賤子叨知已試把塵冠一振纓送弟及之就彭門侍養城南車騎曉駸駸欲去重留酒屢斟惜爾浪浪辭我淚感豫切切戀親心庭闈最樂無妨學風月餘間豈廢吟别後不憂書信少但聞為善是佳音村居幽居一卧枕溪稜階下杉松纒古藤常愛園林深似隱不嫌門戶冷如僧麥宜過社猶催種山近經秋却懶登已把壯心間頓置少年莫要苦相憎燕支板浣花箋寄合州徐文職方合州太守鬢將絲聞説歡情尚不衰板與歌娘拍新調箋供狎客寫芳辭木成文理差差動花映溪光瑟瑟竒名得只從嘉郡樹燕支木嘉州出樣成仍自薛濤時有薛濤箋竒章磊磊馳聲價江令翩翩落酒巵幾首詩成卷魚子有魚子箋誰人唱罷泣燕支紅牙管好同牀置紫竹笙宜一處施直助風流向樽席杏花况是未離披司空圖有杏花辭文頃在睢陽多命唱之御史臺牒督光臺錢牒云以慿石柱鐫名因戲書呈通判寺丞景元幕中久次無他術銜內兼官帶憲司石柱鐫名誠似是豸冠加首竟何為幾曾執簡抨彈去空被光臺督責隨一起鴛鴦戛雲漢應嗤燕雀守藩籬送馮司理之任彭州李白詩中蜀道難把詩試讀淚汍瀾江形詰曲千回折岑路崚嶒萬屈盤登陟去年腰欲折追思今日鼻猶酸豫去年罷嘉州歸此行君不同屯蹇五馬相知舊長官彭牧與君常同官赴任嘉州待闕左綿七十日通判吕國博日相從吟酌至嘉陽因成四韻寄之鼎來豈敢道能詩一見何因便解頥鄉國三千里離别杯盤七十日相知送人江外馬駝妓垂釣寺中魚竭池别後中秋又重九與誰賞月詠東籬顔魯公太師唐家六世樹威恩外建藩翰禦不賓二十三州同陷賊平原猶有一忠臣又聖賢道在唯顔子忠烈名存獨杲卿甘向賊庭守節死不羞吾祖與吾兄禇遂良僕射先皇執手未多時受託誠深誓不違終向君前還此笏一身視死喜如歸陽城諌議衆口喑喑血噤牙獨將忠謇敵姦邪德宗若用延齡相敢有陽城壞白麻袁髙給事擲毫不肯草絲綸宰相逡巡命别人明日執回盧杞制始知唐室有忠臣溫造御史一言膽落折藩臣倔強何人敢恃勳闕下惟聞溫御史蔡州自是李將軍劉栖楚拾遺此節寧甘剛則折平生不肯曲如鈎革囊裹血將何用一汙龍墀死即休讀五王傳聖賢用策寧相逺千載毫釐竟不差四皓當年安漢嗣五王今日復唐家讀晉魯二公傳節似魯公猶被陷忠如裴度亦遭讒上無明主姦邪勝我讀遺編淚滿衫李英公績一言容易廢忠謀徇主從昏可自尤今日始知孤負託當時齧指血空流漢成帝鬱鬱朱雲志不伸上方寶劒欲生塵空留折檻旌忠直左右何嘗去佞臣文中子龍蟄河汾道不行訏謨經濟授諸生由來房魏皆卿相共輔文皇致太平又獨將禮樂付程仇房杜無才闡大猷可惜唐家三百載聲明文物愧宗周初過潼關值雨二十年來憶華山揚鞭西笑入秦川浮雲何苦深遮閉豈是三峰不好賢雨晴賦一絶過關何事懶搖鞭酷愛三峰落馬前天氣清明新雨後山光日色滿秦川過溫湯驪山山下水洋洋一勺之多解破唐敢告後人商鑑近溫湯今日是唐湯初過大散關馬上作奈何山色牽吟思旋被江聲破睡魔吟思睡魔兩相戰誰知馬上有干戈過飛仙嶺二首入蜀牽吟景象濃雲山萬疊與千重癡岩頑壑無竒觀不似飛仙數朵峰又御愛數峰非拔秀當時駐蹕欲忘還飛仙急過無真賞始信明皇不識山峽中路狹才容飛鳥過山將生合奈山何不知天外山長短何事窺來一管多劒門讀賈公疏詩石劒門駐馬立踟蹰讀盡新篇味有餘關令多情兼好事詩名留得賈公疏豫自南京留守推官循資為掌書記由將仕郎超階至朝奉郎得蜀嘉州友人相賀者因答之一循資走五千里四遇恩超十六階自顧非才已過分誰言英俊尚沉埋蜀道中念親有作東望庭幃魂欲銷層層雲棧上岧嶤江聲山色情多少相伴西來慰寂寥泥溪驛中作嘉陵江自大散與豫相伴二十餘程至泥溪背豫去因有是作山驛蕭條酒倦傾嘉陵相背去無情臨流不忍輕相别吟聽潺湲坐到明栁池驛中作二十二餘程鳥道一千一百里江聲聽盡行盡不覺逺西去出山猶七程至羅江出山訪栗園有感逰困歸來訪栗園栗園樹老再生孫莫驚頭上見白髮拾栗兒童長幾畨離鄆州至夀張南村舍中有老姥八十餘出拜老姥龍鍾八十三猶能指點認青衫自言老婦嘗蒙惠白首相將出戶參徂徠集卷四
