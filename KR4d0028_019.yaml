body:
  text: 徂徠集卷十九宋石介撰記祥符詔書記祥符二年翰林學士楊億知制誥錢惟演祕閣校理劉筠唱和宣曲詩述前代掖庭事辭多浮艷真宗訓之曰辭臣學者宗師也安可不戒於流宕乃下詔曰國家道涖天下化成域中敦百行於人倫闡六經於教本冀斯文之復古期末俗之還淳而近代以來屬辭多弊侈靡滋甚浮艷相髙忘祖述之大猷競雕刻之小巧爰從物議俾正源流咨爾服儒之人示乃為學之道夫博聞強識豈可讀非聖之書修辭立誠安可乖作者之制必思教化為主典訓是師無尚空言當遵體要仍聞别集衆製刻鏤已多倘許攻乎異端則是誤於後學式資誨誘宜有甄明今後屬文之士有辭涉浮華玷於名教者必加朝典庶復古風其古今文集可少垂範欲雕印者委本路轉運使選部內文士詳其可否即具本以聞又天章閣待制劉公隨常言故楊翰林少知古道故孫漢公集中有送楊序說其言十一月自建州召試授祕書省正字詔褒之有精彩神助文字生知之語是時名聞天下道路拭目或勸以歌功上美更祈清貫者則掉臂不顧或以其早成夙悟比前代王勃輩者則愀然曰吾將勉力庶幾子雲退之長驅古今豈止於詞人才子乎又崖掾初覽其斷文數十篇大竒之持以示漢公曰皇甫持正栁州少年時正當如是本朝文人稱孫丁而皆推尊之則楊為少知古道明矣然以性諳浮近不能古道自立好名事勝獨驅海內謂古文之雄有仲塗黃州漢公謂之輩度巳終莫能出其右乃斥古文而不為逺襲唐李義山之體作為新制楊亦學問通博筆力宏壯文字所出後生莫不愛之然破碎大道雕刻元質非化成之文而古風遂變時執政馮文懿與二三朝士竊病之又黃州漢公皆巳死他人柔弱無以摧楊雄鋩惟胡大監繼周在且以罪廢屏居廬江乃相與延譽徐言於上乞召知制誥以拉楊之虎牙繼周既至真宗命上殿賜坐從容延問曰知卿雖謫官猶不廢學今復用卿知制誥繼周以久去班行朝禮多廢即拜謝於殿上真宗亦不之罪繼周既退直趨舍人院箕倨坐㕔上睥睨言曰適來見上上金口命胡旦復知制誥胡旦老矣豈能重入此小兒隊裏知得它制誥矜傲輕忽旁如無人真宗以繼周素無行尚疑之潛令小黃門一人隨其後觀之黃門盡以告明旦真宗見文懿具道其事乃曰胡旦終未可用觀其言語亦似詖傾文懿以繼周自為之亦無如之何繼周但得通判襄州去楊遂肆然無復回避矣介讀祥符二年詔書知真宗皇帝真英主矣聞劉待制之說知文懿真賢相矣易曰觀乎人文化成天下為天子能知乎文之本而思復於古非英主與為宰相能悼乎風之變而思救其弊非賢相與介竊懼聖君賢相之事異日泯落因私記之宋城縣夫子廟記天地吾知其易毁也一德不修則裂日月吾知其易喪也一政不行則缺山嶽吾知其易壞也一化不明則崩河洛吾知其易涸也一令不善則竭大哉吾聖人之道彌亘億千萬世而不傾橫維四方上下而不絶莫亂於戰國莫妖於楊墨莫毒於秦嬴莫逆於莽賊司馬譎詐宋齊凶慝虐神猾夏曰聰曰勒倡誕邪教曰聃曰釋于唐接踵五季昏君暴德莫不滅裂衣冠隳棄法則焚燒詩書芟刈禮易吁吾聖人之道受戕害被攻擊斯亦多矣而巍然中居竟不可毁良由根柢堅而枝幹茂也淵源濬而流𣲖逺也三才五常為根柢不亦堅乎堯舜禹湯為枝幹不亦茂乎六籍九疇為淵源不亦濬乎孟荀揚韓為流𣲖不亦逺乎故天地有裂焉日月有缺焉山嶽有崩焉河洛有竭焉吾聖人之道無有窮也夫天地日月山嶽河洛皆氣也氣浮且動所以有裂有缺有崩有竭吾聖人之道大中至正萬世常不可易之道也故無有虧焉宋有天下純用文治制度禮樂一出儒術吾聖人之道大行君君而臣臣父父而子子京師達於郡縣皆崇嚴廟貌而尊祀之宋城在南京為赤縣夫子祠宇尚闕春秋則釋奠於令之㕔事噫其為䙝亦甚矣李大夫堯俞以儒學仕能知聖人為尊不敢黷慢於是拆佛宇淫祠十數區取其材作廟於縣署之右棟宇壯焉丹雘麗焉穹穹闢陽耽耽闔隂夫子被王衮冕執圭尺有二寸負斧依當寧而坐顔淵閔子騫十一人列侍翼如有嚴有威廟成俾豫記之嗚呼異哉李大夫作是廟有三善焉撤佛宇弱夷法也毁淫祠革邪俗也尊聖師明大道也有是三善不可不記故敢承命而不敢讓景祐四年五月一日泰山書院記自周以上觀之賢人之達者皋陶傅說伊尹吕望召公畢公是也自周以下觀之賢人之窮者孟子揚子文中子吏部是也然較其功業德行窮不必易達吏部後三百年賢人之窮者又有泰山先生孟子揚子文中子吏部皆以其道授弟子既授弟子復傳之於書其書大行其道大耀先生亦以其道授弟子既授之弟子亦將傳之於書將使其書大行其道大耀乃於泰山之陽起學舍齊堂聚先聖之書滿屋與羣弟子而居之當時游從之貴者孟子則有梁惠王齊宣王滕文公之屬揚子則有劉歆桓談之屬文中子則有越公之屬吏部則有裴晉公鄭相國張僕射之屬門人之髙弟者孟則有萬章公孫丑樂克之徒揚則有侯芭劉棻之徒文中子則有董常程元薛收李靖杜如晦房魏之徒吏部則有李觀李翺李漢張籍皇甫湜之徒今先生游從之貴者故王沂公蔡二卿李泰州孔中丞今李丞相范經略明子京張安道士熙道祖擇之門人之髙弟者石介劉牧姜潛張洞李緼足以相繼於千百年之間矣孰謂先生窮乎大哉聖賢之道無屯泰孟子揚子文中子吏部皆屯於無位與小官而孟子􅪮於七篇揚子泰於法言太𤣥文中子泰於續經中說吏部泰於原道論佛骨表十餘萬言先生嘗以為盡孔子之心者大易盡孔子之用者春秋是二大經聖人之極筆也治世之大法也故作易說六十四篇春秋尊王發微十七卷疑四凶之不去十六相之不舉故作堯權防後世之篡奪諸侯之僣逼故作舜制辨注家之誤正世子之名故作正名解美出處之得宜辨傳嗣之有嫡故作四皓論先生述作上宗周孔下擬韓孟是亦為泰先生孰少之哉介樂先生之道大先生之為請以此說刋之石立於講堂之西壁康定元年七月十八日記青州州學公田記故僕射相國沂公初作青州學成奏天子天子賜學名且頒公田三十頃以入於學公患田少不足又旁學作屋百二十間嵗入於學錢三十一萬逮今十稔學益興而士倍多太守趙集賢廣公之意取南城隙地又作屋凡八十三間别為旁舍六十二間嵗入於學通六十七萬學之公用於是大充而養士之道稱矣學官與諸弟子侈之請記於壁曰立其法萬物不改者道之本也通其變使民不倦者道之中也本故萬世不改也中故萬世可行也若伏羲神農黃帝堯舜氏樹君臣父子上下之制立其法萬世不改者也是之謂本為服牛乘馬上棟下宇弧矢網罟之宜舟楫耒耜之利棺槨之便臼杵之用通其變使民不倦者也是之謂中焉相國法三代明王之制取古者家有孰黨有庠術有序國有學之制建學於青立本也集賢申易大畜養賢頤養正需飲食宴樂兊朋友講習之義推廣於學制其中也大凡舒則人暇局則人困故善教者優游而至道不善教者急速而强人其要在酌夫勞逸之節焉禮曰張而不弛文武不為也一弛一張文武之道也今夫學者六藝經傳千萬言以時而諷之其為功博矣仁義禮智忠信孝弟之道天地隂陽星辰災變之動以時而求之其為業廣矣廣博而難卒勤苦而後能成蚤起夜誦寒暑不廢衣冠不角則是常張之矣嵗有田日有餼勞有休怠有養所以息焉游焉是一張一弛之道也君子謂相國集賢善教矣張而不急弛而不廢初集賢樂學之成經始甚亟乃擇才吏得節度推官蔡君亶用董其役作屋舍凡一百四十五間而但取材於縣官之餘借力於公家之隙不煩於府不擾於民和說而以成豫謂相國善作也集賢善述也蔡君善卒相國集賢之志也見託斯文既不得讓因記其嵗月云新濟記天聖十年春知兖州工部尚書翰林侍講學士孫公開新濟成夏汶水暴漲盡壞其坊豬於西澤滿弗受腹背溢出橫流湯湯為江為淮轉如天回突如山來勢若吞鄆及夀張東阿人不溺於水如一縷絲一毫髮相維之矣東北注入新濟汶水勢削遂不克患明年京東蝗蟲大旱五榖皆不熟自潘水東至於海尤甚州養兵十數萬倉庫空虛公儲不逮百日或出秕稗糞腐為天子養兵食嬴卒餓軍旦夕洶洶發怒色流怨言郡刺史以下焦然疚於懷不知其所為徒拱手俟罪而巳兩轉運使以是失職罷去天子使轉運淮南倉轉輸於南方凡數千艘由淮達於鄆鄆入於新濟新濟而東東方遂濟噫春新濟成夏汶水漲新濟是賴汶水無害鄆人適安今年新濟成明年東方饑新濟是憑兵不匱食國不乏用民不饑死新濟之為功也如此則速成疾效章章著見於人者故略舉之矣若夫北暨鄆之張澤南暨濟陽郡之巨野民良田百萬頃水宅焉三十年民不得一壠耕一穗收新濟成疏其水入新濟民得是良田播殖五榖以衣食之新濟之功此益為大中國之有四瀆猶人之有四支四瀆濟其一也濟水壅廢地一支矣今濟水復流地之一支復生也地有血脉也有膋胃也濟不壅絶為地道計也且濟水棄滯塞廢三十年三十年不為濟矣今濟水復為濟矣海不受濟之朝三十年海亡一濟三十年矣今濟水復朝於海海復得一濟矣地生一支濟復為濟海復朝濟其功格於地矣及於濟矣及於海矣功又益為大也當濟源涸此功落成祭法曰能禦大菑則祀之能捍大患則祀之此可謂禦大菑矣捍大患矣則公宜受天百祿世世祀之傳子傳孫寖隆寖昌公盡忠三朝白首彌固勳望風迹終焉允臧在太宗朝講經璧水敷助文治觀學王宫啓發孝德在真宗朝堂上疏陳十不可請停西祀又抗言乞焚天書斬朱能以道事君有犯無隱陛下續服日以孔子之六經堯舜禹湯文武周公之道說於上前以輔聖德歷事三世將逾四統年甫及致政三上章乞骸骨歸葬鄉里不得請又四上章乞解近侍守鄉郡天子重勞以官職之事許之既告老去猶以鄆人被水患三十年濟不為濟濟不朝海地廢一支在公家之利為不了卒能成功澤生民利萬世及國家被來世春秋傳曰太上有立德其次有立功謂之不朽若公之立德立功可稱於不朽矣宜刻諸石垂之無窮按濟水出於河南府王屋縣溢於東出於陶丘東北㑹於汶入於海當黃河溢并濟為一河水一石其泥六斗泥淤為岸數百尺河水復濟遂失故道不復能流入於海乃停於鄆之西南為大澤作民患垂三十年公久思之又數議外廷衆口嘵嘵為不可至是復白於上請身自行安肅軍觀察留後陳公堯咨時治於鄆受成於公不敢異公議克同於公天聖十年正月以鄆州之須城中都平隂夀張陽榖東阿齊州之歷城長清合三萬人起鄆魚山盡下把四十里齊州接下把而下又五十里疏濟故道通濟入海一月克成厥功督役則有鄆州通判比部貟外郎張舜元齊州通判國子博士闕隲平隂知縣國子博士李錫歷城知縣太常丞董儲夀張知縣右侍禁王師顔鄆州駐治右班殿直張政中闕縣主簿劉允介自謀始及成功皆預焉故能備述其事景祐元年月日記去二畫本記留守工部彭城劉公隨常親來視學於東庫謂非聖人書宜悉去之不可使學者讀之惑亂其心也公之心可謂正矣噫非聖人書猶不可觀之况非聖人畫乎且自伏羲至於神農神農至於黃帝黃帝至於堯舜堯舜至於禹湯禹湯至於文武文武至於周公周公至於孔子中國猶一人治也由一塗出也有老子生然後仁義廢而禮樂壞有佛氏出然後三綱棄而五常亂嗚呼老與佛賊聖人之道者也悖中國之治者也公所謂非聖人之書者也老與佛之書也老與佛之書猶不可使學者見况使學者見老與佛之像乎書庫有舊存三教畫本索觀之則吾聖人與老氏釋氏等使學者趨老與佛亦將同吾聖人也讀其書猶懼惑亂其心使趨老與佛同於吾聖人豈知不易吾衣冠棄吾父子捨吾君親廢吾祭祀相與同歸於夷也三教畫本獨存吾聖人朝夕令學者拜事庶幾知吾師之尊吾教之一吾道之正所謂老與佛二者吾令悉去之後來者有謂吾不恭職失二畫本吾故書失以告宣化軍新橋記康定二年冬十月戊午宣化軍使虞部貟外郎張景雲作清河橋成河初不通故為之舟則人利舟也及其弊也舟反害人河不復通故為之橋救舟弊也善哉其達變也與聖人之於天下之道有作焉有因焉有變焉未有初也故作未有制也故因制失故變變者救其失也漢董仲舒曰道者萬世無弊非無弊也得救之之道也毁舟為橋善變者乎易曰通其變使民不倦其是之謂矣河去軍北門數步其流不絶如縷深不濡軌廣不逾丈非如彭蠡洞庭之險而人病涉則甚於彭蠡洞庭實舟之為也舟有十五人十五人為十五家家率七口為百五口百五口之衣與食皆取於舟晨起十五家磨牙動吻伸頭奮距以搏以噬憧憧往來人罕完膚吁上下相容州縣無政孽苗遂盛姦府遂成凡此橋歷二年更六人成輒壞者三卒成於君如此其艱孽苗大而難拔也姦府固而難破也非君之誠與斷孰克哉初天章閣待制知淄州軍州事郭公勸侍御史京東轉運使張公奎始謀毁舟建橋授謀於縣而郭以憂去張徙河東其後虞部郎中胥君榖繼來為州國子博士霍君某通判州事虞部貟外郎韓君榖為縣雖述二公之志而橋再壞逮吾橋卒成當二公之志橋壞也人咸曰橋不可作也物有數事有廢興廢興存諸時成敗繫於天皆不在人君來代韓聞其說獨以為不然苟興廢成敗皆不在人則救懷襄之患者非禹也與定管蔡之亂者非周公也與平諸吕之難者非勃也與去鱷魚之暴者非吏部也與作一橋不能圗久人無誠也乃推諸天患誠不至而不患功難就視事之日亟至河上且嘆曰州縣之政莫大於是者州之大者方千里縣之大者方百里政之善惡不出千里之內自東自西自南自北孰不由此塗出也苟有利焉天下享之苟有害焉天下被之在周官則曰司險周知其山林川澤之阻而達其道路在孟子則曰十一月徒杠成十二月輿梁成在春秋傳則曰啓塞從時况二公謀於初三君作於後願竭才卒成此橋且舟之為害也逺矣吾為利也豈謀近哉百世後從已不可苟作為百世計也其作之也梓材以新制度以侈夏六月已酉明日落成其夕橋又壞君曰天固助豫非有姦橋何壞韓君再為橋橋再壞壞有故也吾一為橋橋一壞壞於姦也吾來討姦者終成吾橋然後信吾之志而奪姦人之心暴姦人之罪益勤不懈日出臨河上工之拙巧材之良惡斧斤之髙下繩墨之曲直必親焉毋不良日入歸如此九十有七日橋乃成凡五虹三十七柱七十八梁皆大木也所以取大壯而圗不朽噫衣乎舟食乎舟者百餘人爪距森森牙齒齗齗相與橫跂盤錯於其間崇姦深樹孽大非君智果姦府不破非君特達孽苗不拔始壞再壞三壞也衆口囂囂咸請罷由於克斷君聽不亂由於克誠此橋卒成嗚呼君之功茂焉十月初九日記柘城縣巡檢廨署記天下有事也天子日旰而食公卿側坐而謀大夫露宿而行命士晝夜走以赴命况庶人乎天下無事也農閒於野工遊於府商嬉於市士大夫不醇駟不駕不兼味不食髙冠寬衣恬愈舒緩為事况天子公卿乎帝宋有天下八十年矣艱難於太祖勤勞於太宗汲汲於真宗逸於陛下始於胼胝中於癯瘠今至於安樂泰舒內外官萬餘貟無所事事食天子廩祿而巳不矜車輿不飾第宅安為哉右侍禁韋君濤朝廷命擒察南京之宋城楚丘下邑寧陵柘城榖熟虞城盜賊治所在柘城舊是廨宇卑圯風雨弗蔽韋君至則曰天子賜廩祿非獨奉臣身亦將以仰事父母俯庇妻子今居無厚墻完廬日暴濕其身體豈聖君推孝治待臣下之意邪况海㝢富康洊嵗豐稔家給人足盜賊不作幸外無職事內置吾親於康寧不亦可乎舊署之囂塵湫隘者悉更之髙明爽塏於是燕寢有堂飲食有位廄庫井竈罔不有秩上以荷大君養育內以逸樂其親及於其妻兒韋君中無歉然不足者非我列聖相勤養理宇內無事韋君當如前所述晝夜走赴職弗暇豈及於此乎豫吏睢陽韋君以新署成乞文為記因感天下之人各得其所且嘉韋君之能厚於其親遂命筆直書之無罪略焉云爾時景祐四年六月二日記鄆城縣新堤記太祖太宗用武當是時武夫帶一刀負一矢取功名如山嶽書生吐一竒運一䇿闢土地數千里聖勳臣勞告天地宗廟外內文士得取為歌詩頌贊刻於金石播諸管絃荆潭臣僕甌閩內屬蜀師來降李煜渡江吳人慕化并汾納社天覆地載之內一用宋正朔罔敢二志真宗以文守陛下以孝治通五十六年生物鬯遂積榖豐實海內恬嬉閒暇習於爼豆文儒藴藉尚以章句武夫書生莫得如向之取功名闢土地者學史者磨墨濡毫俟以嵗月竟無有卓卓勳烈可稱紀載夏四月豫臥睢陽公舍鄆城縣令劉君準遣使致書於豫曰故鄆城為水濕敗豫作新城於故城西南十五里遷其民而居之兩逾月不止水如故城謀再遷之則重勞吾民且巨野在天下為大澤之一周視邑內無髙燥旁可居萬家之處雖再遷之水亦隨去與其勞民而再遷遷不逺水不若惜是民力擇久安之計民無頻遷水不為患斯亦可也於是環城築長堤千九百步髙二十丈厚九尺足以捍城矣足以禦水矣堤成豫復念曰今雖作堤堤久必壞嵗須補之乃無壞若一嵗一補堤薪芻取於民令苟不恤民吏因緣為姦蠧傷吾民是吾作堤非以為利也反以為害也因即堤上下城裏外楊樹萬有三百栽曰他日堤之薪芻是供可以緩民之憂矣今堤既成且固栁皆青青榮活葉可蔽日太平為吏不從軍邉塞效萬死一生尺寸功求榮名書國史此為績雖細猶愈夫坐而視民溺死不救者焉已從梁山上轉圎石至縣門用匠磨琢成就光滑可書堅厚可存願得君文以記嵗月噫豫從事斯文久矣常如向所述不得卓卓勳烈可紀載劉君之功雖非卓卓者刋之於石亦無愧焉遂記之景祐四年六月一日祭堂記周制天子七廟諸侯五廟大夫三廟適士二廟庶人祭於寢唐制三品已上乃許立廟天寶十四年四品清官亦許立廟介今官為節度掌書記在國家官器今從七品說者謂適士上士也官師中下士也庶人則府史之屬也介為庶人則嘗命於天子又未至於適士其官師乎在周制得立廟一唐制則未得立廟今祭於寢則介之烈考嘗為東宫五官且鬼神之道尚嚴於寢實為黷神將立廟則介品賤未應於式貴賤之位不可犯求其中而自為之制乃於宅東北隅作堂三楹以烈考及馬夫人劉夫人楊夫人後劉夫人居焉薦新及於烈考四夫人而已時祭則請皇考皇考妣王考妣咸坐緣古禮而出新意也推神而本人情也慶厯元年辛已十一月十七日建拜掃堂記石氏既用康定二年辛巳八月八日舉夫王父下為三十三墳葬於祖墳塋復立祭堂於宅東北位葬之以禮祭之以禮也石氏從周得姓逮於今二千餘年自滄徙居至於今百五十餘年矣祀逺惟介之烈考能談其譜討源及流實為祥盡小子識之烈考終不有識大懼墜落又為石髙五尺廣二尺三寸厚一尺列辭二千三百六十八字表於墓前又思夫千萬世風雨燥濕石久必泐字久必缺不可無蔽覆且嵗時必上冢出必告於墓及拜於墓則皆有祭不可以無次設乃直塋前十四步為堂三楹一以覆石一以陳祭因謂之拜掃堂云慶厯二年壬午三月五日記徂徠集卷十九
