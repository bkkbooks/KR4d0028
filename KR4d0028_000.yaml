body:
  text: 徂徠集别集類二宋提要臣等謹案徂徠集二十卷宋石介撰介字守道兖州奉符人天聖八年進士及第初授嘉州判官後以直集賢院出通判濮州事迹具宋史本傳初介嘗躬耕徂徠山下人以徂徠先生稱之因以名集介深惡五季以後文格卑靡故集中亟推桞開之功而復作怪說以排楊億其文章宗㫖可以想見雖主持太過抑揚皆不得其平要亦戛然自異者王士禎池北偶談稱其倔强徑質有唐人風較勝栁穆二家而終未脫草昧之氣亦篤論也歐陽修作介墓志稱所為文章曰某集者若干卷又曰某集者若干卷凡重言之似原集當分為二部此本統名徂徠集殆後人所合編歟第四卷內寄元均叔仁讀易堂永軒暫憩四詩有録無書則傳寫脫佚亦非盡其舊矣介傳孫復之學毅然以天下是非為已任然客氣太深名心太重不免流於詭激王稱東都事略記仁宗時罷呂夷簡夏竦而進章得象晏殊賈昌朝杜衍范仲淹韓琦富弼王素歐陽修余靖諸人介時為國子直講因作慶厯聖德詩以褒貶忠佞其詩今載集中蓋仿韓愈元和聖德詩體然唐憲宗削平淮蔡功在社稷愈仿雅頌以紀功是其職也至於賢姦黜陟權在朝廷非儒官所應議且其人見在非蓋棺論定之時迹涉嫌疑尤不當播諸簡牘以招恩怨厥後歐陽修司馬光朋黨之禍屢興蘇軾黃庭堅文字之獄迭起實介有以先導其波又若太學諸生挾持朝局北宋之末或至於臠割中使南宋之末或至於驅逐宰執由來者漸亦介有以倡之史稱孫復見詩有子禍始此之語是猶為一人言之未及慮其大且逺者也雖當時以此詩得名而其事實不可以訓故仍舊本存之而附論其失如右乾隆四十五年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
