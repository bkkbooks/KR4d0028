body:
  text: 徂徠集卷一宋石介撰頌宋頌九首并序詩序曰頌者美盛德之形容以其成功告於神明者也夫有盛德大業然後著之於文辭有粹文俊辭然後見之乎功業德與辭表裏功與文相等然後奮為文藻摛為英聲昭為烈光暐暐煜煜如日之華鏗鏗訇訇如雷之行暢於無前揚於無上江浸海流天髙地厚靡有窮盡若周之文武興起王業公旦制作禮樂成康積隆太平宣王繼起中興其功偉歟漢之髙祖定禍亂文景尚恭儉孝武却攘戎狄光武恢復先業其功偉歟唐之太宗誅李密王世充竇建德薛舉輔公祏明皇除太平公主相姚宋開元三十年升平憲宗斬楊惠琳劉闢吳元濟復諸侯地數千里其功偉歟我國家太祖武皇帝一駕而下澤潞再矢而定維揚三揖而納荆潭四指而收蜀廣五征而平江南太宗文皇帝克紹前烈亦既郊祈南致淮海數十州之地才謀順動北縛并元四十五年之寇真宗章皇帝暫臨澶淵胸奴喪威墮膽逮今四十年樂我盟好不敢箠馬而南今皇帝在明道之初獨臨軒墀躬厥庶政神謀睿斷如雷之動六合莫不震焉發號施令如風之行萬民莫不仰焉登任哲俊剪鉏姦惡天清地明日燭月霽其功也如此鴻烈景鑠乃可作為歌詩雅頌流於金石被於管絃報天地而奏宗廟感昆蟲而和夷貊矣故周有清廟生民臣工天作雍潛勺武漢有中和樂職聖主得賢臣唐有晉陽武獸之窮涇水黃奔鯨沛淮夷方城元和聖德諸篇臣介竊擬前人輒取太祖太宗真宗陛下功德之尤著見者為宋頌九篇臣雖齒髮堅壯未為衰老自視材智甚短施之於事無毫髮之長虛生盛明之時真以為愧然文采晦昧體格卑脞不足以稱述四聖君之耿光亦庶乎萬一有以開太平之頌聲云皇祖太祖皇帝初用師澤潞誅李筠伐揚州滅李重進也皇祖神武疇敢作蠧元年四月筠叛於潞皇祖躍馬至潞城下筠伏其辜擴清中夏皇祖龍驤疇敢猖狂元年九月進叛於揚皇祖揮戈至揚城隅進窘金樓并焚其孥惟我皇祖端拱垂旒應天順人實代有周罔有不同天時人謀四海陶鈞涵濡養撫罔有失所大德其裕筠胡敢違進胡不隨豫匪汝誅汝自取之既剪二盜聖武彌耀荆潭蜀吳如拔腐草皇祖六章二章八句一章六句三章四句聖神太祖皇帝出師援長沙且假道遂取荆潭也不疾而速不怒而威惟聖惟神其幾其微二國之君各保爾土虎憑於山莫豫敢取蛟憑於淵莫豫敢侮萬斯年兮關鐍以固聖機神謀天祕地藏風行雷動旦秣我馬夕取其疆二君不知晏眠于床具篙與舟同朝天子一發五豝二君皆至皇祖聖神鴻光丕懿聖神四章一章四句一章八句一章七句一章六句湯湯太祖皇帝收蜀取孟昶也湯湯其江區區爾孟一夫當闕不知天命蟻固于穴蛙負于井咫尺之地為可以騁彼以險守我以德懷王師東來函谷自開蜀虜授首呼號哀哀蜀人鼓舞與我偕來首時蜀道絶人來往今蜀既平王道蕩蕩尉候一至朝貢相望巍巍皇祖德聲逺暢湯湯三章章八句莫醜太祖皇帝用周渭之策命潘美取廣州也莫醜匪虺莫悍匪兕有鋹在南毒螫不已沸湯熱火暴我赤子皇祖曰吁天生蒸民總之君長以養以仁乃豫不恤匪鋹之嚚乃謀于渭乃將于美王師鷹揚涉江萬里闢其城門鋹號請死皇祖有德乾覆坤容豫在弔民不殺以封皇祖慈仁感於昆蟲莫醜四章章六句金陵太祖皇帝命師取李煜也金陵峨峨長江萬里誰為巢穴養此蛇豕天豈作限而險而恃不順不臣敢亢天子帝赫斯怒王師除驅蕞爾螻蟻豈勝誅鉏哀哀窮俘爰叫以呼歸于京師燀哉聖謨金陵二章章八句聖文錢俶以吳越歸也聖文安安聖武桓桓朝貢萬里正朔百蠻無吳之險無蜀之艱無潭之嚚無荆之頑咸豫賓順悅色和顔彼俶在杭有地千里皮毁毛落孤睽莫恃懾服聲教慕為臣使携彼人民挈其土地于槖于囊歸于天子天子神聖罔不懷柔既懷而封恩涵澤流逆豫有刑視彼揚州順豫有封視此錢侯赫赫宋德有何窮休聖文三章章十句六合雷聲太祖皇帝親征太原取劉繼元也六合雷聲中國有君塗其耳目不使聽聞隔在荒外嗟爾并人匪民之嚚為賊俘虜往弔其民王澤時雨往伐其罪王師虎旅昔時錢俶有國於吳今俶歸我為吾前驅并人望風請為臣奴舊是胸奴為并左臂今附有德不與賊子并人失恃求就戮死撫我則懷并人肯來降旗出城并門夜開并土既平吾王休哉往在藝祖未遑拓㝢遺我聖祖啓此北土取告太廟於皇孝武六合雷聲六章章六句聖武敵犯我疆至於澶淵真宗皇帝親臨六師射殺敵酋軍不得歸乞盟請和也聖武惟揚鷹師虎旅至于澶淵執彼醜虜醜虜之來蜂蠆敢怒我師如律不怒以懼既俘其帥請示死所聖仁如天惡殺好生于以耀德匪來觀兵亟命止戈無兹黷刑不𠞰其類戴我以兄屈膝請和畏我威靈棄甲以歸處彼北隩千斯年兮永以為好邊人其安養幼送老民有肥田馬有茂草威德逺兮思我聖考聖武三章章十句明道莊獻明肅皇太后崩今皇帝陛下獨臨軒墀聽决萬幾睿謀聖政赫然日新也明肅惟母實勤養撫有臣有虎有離有附請王祿産請廟考祖古人有之規吕矩武政在房帷小人乘時十年于兹惟幾惟微聖仁如天不識不知龍晦其威神藏其為明道四月睿德明發帝褰簾箔出臨軒榻總攬萬幾指揮六合聖人之興雷動乾行進退大臣顔色和平誅逐羣豎左右不驚不怒不威不疾而速百蠻偷息百官整肅土無二主惟辟作福圖任哲乂拔崇賢能旌賁忠臣死生光榮洗刷敝風宮闕清明惟帝之道與時而默靜則坤闔動則乾闢十年深宫不有其權今日南面退姦進賢宋承大統八十年矣明道之政獨為粹美唐三百年時惟開元猗歟明道開元同年明道之政可以歌舞小臣作頌實慚吉甫明道十一章二章八句四章六句五章四句慶厯聖德頌并序三月二十一日大昕皇帝御紫宸殿朝百官相得象殊拜竦樞密使夷簡以司徒歸第二十二日制命昌朝參知政事弼樞密副使二十六日敕除修靖素並充諫官四月八日皇帝御紫宸殿朝百官拜衍樞密使仲淹琦樞密副使乃用御史中丞拱辰御史邈御史平諫官修靖十一疏追竦樞密使敕十三日敕又除襄為諫官天地人神昆蟲草木無不歡喜皇帝退姦進賢發於至聰動於至誠奮於睿斷見於剛克陟黜之明賞罰之公也上視漢魏隋唐五代凡千五百年其間非無聖神之主盛明之時未有如此選人之精得人之多進人之速用人之盡實為希濶殊尤曠絶盛事在皇帝之德之功為卓犖瑰偉神明魁大古者一雲氣之祥一草木之異一蹄角之怪一羽毛之瑞當時羣臣猶且濃墨大字金頭鈿軸以稱述頌美時君功德以為無前之休丕天之績如仲淹弼實為不世出之賢求之於古堯則䕫龍舜則稷契周則閎散漢則蕭曹唐則房魏陛下有之諸臣亦幸今天下之人望為宰相諫官者陛下盡用之此比雲氣草木蹄角羽毛之異萬萬不侔豈可翻無歌詩雅頌以播吾君之休聲烈光神功聖德刻於琬琰流於金石告於天地奏於宗廟存於億萬千年而無窮盡哉臣實羞之臣嘗愛慕唐大儒韓愈為博士日作元和聖德頌千二百言使憲宗功德赫奕煒燁昭于千古至今觀之如在當日陛下今日功德無讓憲宗臣文學雖不逮韓愈而亦官於太學領博士職歌詩讃頌乃其職業竊擬於愈輒作慶厯聖德頌一首四言凡九百六十字文辭鄙俚固不足以發揚臣子之心亦欲使陛下功德赫奕煒燁照于千古萬千年後觀之如在今日也臣不勝死罪臣賤無路以進姑藏諸家以待樂府之采焉於維慶厯三年三月皇帝龍興徐出闈闥晨坐太極晝開閶闔躬攬賢英手鋤姦枿大聲渢渢震搖六合如乾之動如雷之發昆蟲􅲈蠋妖怪藏滅同明道初天地嘉吉初聞皇帝戚然言曰豫父豫祖付豫大業豫恐失墜實賴輔弼汝得象殊重慎徽密君相豫久豫喜君伐君仍相豫笙鏞斯協昌朝儒者問學該洽與豫論政傳以經術汝二二相庶績咸秩惟汝仲淹汝誠豫察太后乘勢湯沸大熱汝時小臣危言嶪嶪為豫司諫正豫門闑為豫京兆堲豫讒說賊叛于夏往豫式遏六月酷日大冬積雪汝暑汝寒同於士卒豫聞心酸汝不告乏豫晚得弼豫心弼悅弼每見豫無有私謁以道輔豫弼言深切豫不堯舜弼自笞罰諫官一年奏疏滿篋侍從周嵗忠力盡竭契丹亡義檮杌叨餮敢侮大國其辭慢悖弼將豫命不畏不懾卒復舊好民得食褐沙磧萬里死生一節視弼之膚霜剝風裂觀弼之心鍊金鍛鐵寵名大官以酬勞渴弼辭不受其志莫奪惟仲淹弼一䕫一契天實賚豫豫豈敢忽並來弼豫民無瘥札曰衍汝來汝實黃髮事豫二紀毛秃齒豁心如一兮率履弗越遂長樞府兵政毋蹶豫早識琦琦有竒骨其器魁礧豈視扂楔其人渾朴不施剞劂可屬大事敦厚如勃琦汝副衍知人豫哲惟修惟靖立朝讞讞言論磊砢忠誠特達祿微身賤其志不怯嘗詆大臣亟遭貶黜萬里歸來剛氣不折屢進真言以補豫闕素相之後含忠履潔昔為御史幾叩豫榻至今諫疏在豫箱匣襄雖小臣名聞豫徹亦嘗獻言針豫之失剛守粹慤與修儔匹並為諫官正色在列豫過汝言無鉗汝舌皇帝聖明忠邪辨别舉擢俊良掃除妖魃衆賢之進如茅斯拔大姦之去如距斯脫上倚輔弼司豫調燮下賴諫諍維豫紀法左右正人無有邪孽豫望太平日不逾浹皇帝嗣位二十二年神武不殺其默如淵聖人不測其動以天賞罰在豫不失其權恭已南面退姦進賢知賢不易非明不得去邪惟難惟斷乃克明則不二斷則不惑既明且斷惟皇之德羣下踧踖重足屏息交相告語曰惟正直毋作側僻皇帝汝殛諸侯危栗墮玉失舄交相告語皇帝神明四時朝覲謹修臣職四夷走馬墜鐙遺策交相告語皇帝神武解兵修貢永為屬國皇帝一舉羣臣懾焉諸侯畏焉四夷服焉臣願陛下壽萬千年徂徠集卷一
