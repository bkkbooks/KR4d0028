body:
  text: 徂徠集卷三宋石介撰古詩感事吾嘗觀中夏地平如砥石幅員數萬里車馬通轍迹帝宅居土中紫垣當辰極長江斷其南絶塞經其北東海西流沙天為限夷狄三代千餘年天子雖務德實以險為恃四夷皆潛匿漢唐德稍衰地勝豈殊昔暫來還亟去不敢窺城壁石晉一失謀六州淪異域天地破扃鐍山川無阻厄貽爾子孫患固知非逺䇿桓桓周世宗三十纂堯厯一歲破河東劉崇喪精魄再歲復秦鳯不庭自柔格三歲出南狩王師拯焚溺江北十四州取之如卷席四歲征關南曽不發一鏑三州相繼降德聲揚蠻貊李升請臣妾錢鏐修貢職帝欲因兵鋒乘勝務深擊直取幽州城拓土開疆埸重收虎北口復關閉冦賊是時戰屢克六軍氣吞敵平吳如破竹成功在頃刻惜哉志不就暴疾生中夕帝宋承大寶聲名發丕赫全蜀獻土地舉吳上圗籍荆潭與甌閩助祭來匍匐開城納江俘御樓受晉馘區內一正朔六州獨割剔憤憤栁宗儀才宏包旦奭生長在河朔耳目熟金革旗鼓朝治兵酒肴夜結客握臂説心誠倒囊堆金帛客以豪傑士遇侯頗感激往來達厥誠生死願效力萬德納我説洞然絶嫌隙事成已有萌侯去何云亟豪傑夜空回帳中屢嘆息我覽此二事天意終難測撫卷一感傷兩眼淚澘滴送張革從道謁千乘縣田祕丞京張生何人者琅玕滿懷抱三十命未興家貧親且老出門無所適獨守西山操飢寒屢侵凌仁義自充飽手裏璆琳珍不屑徑寸寶足底麒麟文不踏荒榛道十月客中寒霜風鳴浩浩張生氣愈壯徑髮上衝帽松筠凍不折枝葉轉青好雪深徒三尺麒麟不受淖東方有賢者開廄納騕裊臨風試一鳴應免編牛皂送范曙赴天雄李太尉辟命吾家泰山徂徠間濃嵐潑翠粘衣冠君來訪我茅屋下正值山色含春寒終日把酒對山坐幾片山色落酒闌峰頭雲好望無倦篘裏酒多傾不乾臨行再拜殷勤别請我一言披心肝吾貧無錢以贈君門前峨峨橫兩山願君節似南山髙眼看富貴如鴻毛伯樂之廏無駑駘豫章之才多瑰材相君新坐碧油幢之子直上黃金臺秋風蕭蕭動笳鼓落葉槭槭鳴樽罍將軍手持十萬騎陳前號令如疾雷從事借籌為決勝運於掌上何恢恢蠢兹元昊命螻蟻西師堂堂難當哉况我賢相賢從事北門無憂宜大開安道登茂材異等科嘗言春官氏設官何齷齪屑屑取於人辭賦為程約一字競新竒四聲分清濁矯矯逸雄才動為對偶縛恢恢朝董䇿亦遭聲病落每嵗棘籬上所得多浮薄嗟哉浮薄流不知王霸略六經挂東壁三史束髙閣瑣瑣事雕篆區區衍述作隨行登一第謂身翥寥廓趨衆得一官謂身縻好爵栖栖咫尺地燕雀假安託汲汲五斗米堆鶩資飲啄壯哉張安道少懷夫子學三就禮部試不肯露頭角恥用衆人遇羞將一戰較甘心拓翼歸豫志本卓犖三賢文章師大參宋公副樞蔡公使相范公連章稱薦儒林推先覺百鳥聲喈喈獨能辨鸑鷟玉石方混淆獨能識真璞薦之於天子此材堪輪桷遂得望清光三節近帷幄僚友視萬乘器宇誠嶽嶽願乞數刻景古今可揚𣙜縱橫三千言得雋如奪矟上下馳皇王周旋騁禮樂逺推災異源上究星文錯直言補主闕危論針民瘼天子覽其奏嘉賞為嗟愕既嘆相見晚且言同時樂一命校祕書恩澤優且渥追惜漢武世仲舒道磽確再念文宗朝劉蕡命蹇剝有才無其時徒抱此誠慤吾君嗣丕基百王慙景鑠萬物蒙休嘉四夷奉正朔賢良得其時才命不相虐子今乃大遇君臣無隔膜我賀吾君明取士得英卓我賀安道行逢時不踸踔行願入廊廟鈞軸在掌握上使斯文淳下使斯民朴五帝德可追三王豈為邈寄復熙道四五十年來斯文何屯蹇雅正遂凋缺浮薄競相扇在上無宗主淫哇千萬變後生益纂組少年事雕篆仁義近消亡聖經亦離散其徒日已多天下過大半路塞不可闢甚於楊墨患辟之使廓如才比孟子淺患大恐不救有時淚如霰大賢為時生去聖猶未逺昔日到汶上熙道始相見知道在熙道一見不敢慢尊之如韓孟與道作藩翰今春來南都明復去京輦未識心相通所懷恨未展明復無羈縛我有守官限南走三百里訪我殊不倦劇談露胸臆胸臆無畔岸髙文見事業事業著編簡一一皇伯略縱橫小管晏磊磊王佐才上下包周漢二賢信命世實為有道見天使扶斯文淳風應可變我綴二賢末材駑愧欵段詔下勉諸生禮部文章淵波浪百尺髙進士英俊窟蛟龍千萬條吾子欲求濟整子棹與篙吾子欲求勝操子戈與矛勿謂水可狎徒行思逰遨勿謂龍可馴空手揭鬚毛神波忽洶湧怖死填蟹螯龍角忽張怒走同蝦蟇曹茍利篙楫往跳海如溝濠茍操戈矛行壯蛟如猿猱吾言有所勉非徒聲嘈嘈感興村居何所適種木種桑梓田園繞家舍逺不踰十里欵段足乘騎代步而已矣但識畜駑駘安知有騏驥臘月北風寒太行山色紫君命急如火城頭見烽燧雪深馬僵倒十夫扶不起軍法有明訓後期者誅死倚鞍思駿骨撫轡念緑駬求之不可得觳觫滿眼淚旁聞負薪叟竊語相譏刺居安常念危在險如處易臨難始求濟狼狽徒勞爾有備則無患古人垂深旨平居無事時華廄深祕邃嘉穀與豐草秣飼勞廄吏駑駘飽相枕素飱不知愧伯樂能識馬每來加勸説飛兔與騕裊日牽在都市為愛千金資貪吝不肯置今日臨艱難努力自勉勵又送從道常欲飽暖天下人其道未得一寸施子有二親皆七十粳核不充常寒飢昨日訪我破屋下具雞一隻酒一巵子起却盤筯不舉吾親未省曾食之對我欷噓涕泗下孝子之心真可悲子固與我同一體相間豈復有毛皮顧子之親則吾親吾親凍餒無奈何飽暖天下心徒為送子出門成此詩密真杜公作鎮於魏天章李公領使於魏明復先生客於魏熙道宰於魏因作詩寄古魏信名地曹劉遺英躅李唐三百年恨為干戈蹴建安風不還南皮草空緑寥寥千餘祀風流今始續李杜二賢公清猷鎮雅俗詩名占唐代二公本名族聖時還並生聲烈相薰馥朝廷倚金湯天子恃心腹盛德繫物懷威望憬夷服千里無驚烽三軍安食粟休然德化厚蒼生坐蒙福先生服仁義懷道輕爵祿非其義不取一簞亦自足陳蕃知人明文侯好士篤解榻延徐孺過門識干木今留三公館德修令問淑熙道富天爵孝弟聞鄉曲孔孟信可蹈聖賢良自朂漢庭新射策驟升校書局魏縣方百里君命往養育三公佐世傑二賢不碌碌相與施禮讓物歸不待宿相與講道義教化神以速賢人時遘會間不容薄縠五百年一賢今乃同時生千里猶比肩四賢今連甍相聚誠可樂相得良有情我愧孤且陋徒抱此寸誠處乾比無首在泰非彚征出門皆同人坎坎于郊行獨鶴逺無和栖栖在隂鳴安得雙飛翼一翥鄴都城偶作晉公平淮西兵出速如神崇韜伐西川六十日請臣太祖初受命諸侯未盡賓蜀廣號敵國荆潭為強鄰王師討有罪不聞過十旬元昊誠螻蟻有地長一畛詎足汚斧鉞尋當投荆榛是何逾歲月務行含貸仁豈兹將帥間迥無晉公倫張旗發一號豈無李處耘提戈出一戰豈無王全斌客兹井中蛙蕩漾於流津平生讀詩書胸中貯經綸薄田四五畞甘心耕耨勤倚鉏西北望涕淚空沾巾詔罷縣令舉一絃獨不調謂琴皆可廢一目獨不張謂網可皆毁易絃張其目網在琴聲備令舉或非人止當罪舉吏遂令天下不得舉廢琴毁網復何異植萱一人橫行武王則羞今西夷之醜抗中國而敝萬乘西夷之服升黃堂而驕諸侯尊於天子滿於九州王法不禁四民不收植萱於階兮庶忘吾憂贈李常李堂王黃州禹稱張尚書詠髙夫子李相國皆漢人顓頊宅帝丘放勳葬咸陽有虞漁雷澤三帝聲汪洋帝丘咸陽雷澤皆為漢州聖人遺風烈生民多俊良吾宋八十年賢傑近相望黃州號辭伯兩朝專文章尚書實大臣朝廷畏雄剛堂堂髙夫子立言嫓荀揚凜凜李丞相功業齊蕭張三人名未滅相國方騰驤又生不世才李常與李堂二子皆絶羣鳯凰摩蒼蒼一舉一萬里志氣不可量斯文各白首寒金敲琳琅古音抱淳淡雲和與空桑豪氣邁儔匹騕裊與飛黃千里希一賢四公乃同鄉二子復穎耀士風實深長遙知漢水上千載留聲光愛日勉諸生白日如奔驥少年不足恃汲汲身未立忽焉老將至子試念及此則晝何暇乎食夜何暇乎寐間興大匠構厦屋取直棄曲木如何官擇人棄直獨取曲養苗除稂莠養民除貪垢存莠苗不碩去貪民自富過潼關昔帝御中原守國用三策上䇿以仁義天下無能敵其次樹屏翰相維如磐石最下恃險固棄德任智力驅馬過潼關覽古淚澘滴開元帝道明百蠻奉周厯田野富農桑邉隅無寇賊紫宸日視朝潼關夜常闢天寶君政荒宫闈養虺蜴恩愛成怨疾腹心生毒螫朝聞發漁陽暮已卷河北鳴鼓渡潼關矢及乘輿側重門徒爾設關吏安所職始知資形勢不如修道德勉師愚等不行一千里安得為良馬不連十五城安得稱善價汝皆有血氣非如木偶者撮髮號男兒肯甘在人下汝不聞圗王不成猶可霸舜與吾俱人學之則舜也汝等但勉旃前賢皆可亞寄弟會等吾門何所喜子襟青青多豹常志古道佩服卿與軻平淑號能賦其氣典以和樞從吾日久道德能切磋澤也齒最少已有亭亭柯彰頗通典籍所立不么麼淳乎性源濁今亦為清波就初學誦詩日記十板過材雖有髙下異日俱甲科會汝少俊異美若玉山禾看汝辭林中枝條漸婆娑合亦稍純茂知不隨身矬其流雖涓涓可導為江沱視汝器磊磊淳流皆蚌螺我有堇山錫欲鑄為太阿誠能勉就學穎利如銛磨翹翹數子間可與相肩摩五月十日雨明道二年鞭土不見血頑石雲不蒸鞭龍不至痛六合雷不升吾君與吾相威德震八紘萬物各修職雨師獨敢寧送李堂病歸春風汶水溫曉日徂徠寒之子御病歸請豫開一言豫知去病術為子陳大端豫嘗學聖人試將道比論道病非一日善醫惟孔韓賞罰絶於周孔筆誅其姦春秋十二經王道復全完佛老熾於唐韓刀斷其根原道千餘言生民復眠餐道病由有弊邪偽容其間身病由有隙風邪來相干子欲治斯道絶弊道乃存子欲治子身杜隙身乃安此理近古醫吾言有本原二子以食貧困於藜藿為詩以勉之吾世本寒賤吾身守貧約家徒立四壁無田負城郭終嵗服一衣無裝貯囊槖吾雖得一官官微月俸薄况屬嵗荒凶飢民填溝壑吾幸有寸祿不至苦殞穫隨分且飽暖不然亦流落爾等勤初學無恥衣食惡仁義足飽飫道德堪咀嚼二者肥爾軀不同乳與酪爾勿嫌粗糲爾勿厭藜藿富貴自努力青雲路非邈蜀地多山而少平田因有云五穀無種處蜀地土田窄癡岩頑石長不休詵詵赤子將何食彼縣吏嗟乎嗟乎彼縣吏剝膚椎髓民將死夏取麥兮秋取粟笞匹紅兮杖匹紫酒臭甕兮肉爛床馬餘粱兮犬餘餼雀腹鼠腸容幾何虎噬狼貪何無已蝦蟇夏雨下數尺流水滿池泓蝦蟇為得時晝夜鳴不停幾日飽欲死腹圎如瓶􅎆巨吻自開闔短項或縮盈時於土坎間突出兩眼睛是何癡形骸能吐惡音聲嗟哉爾肉膻不中為犧牲嗟哉爾聲粗不中和人情殊不自量力更欲睥睨橫海之鱣鯨自謂天地間獨馳善鳴名萬物聒皆聾不知鐘鼓欽欽雷霆閎閎應龍戢腦入海底鳯凰舉翼摩青冥此時各默默以避蝦蟇鳴何時雨歇水澤涸青臭泥中露醜形失水無能為兩腳不解行乾渴以至死盡把枯殼填土坑劉生病歸泰山山前有瓊圃其中不樹蕨與薇千頭緑竹瑤實甘百畝玉芝丹粒肥麒麟彳亍鳯凰飽鼓趐奮翼揚清輝徂徠山下少耕鋤蒿藜滿圃無芳菲騶虞不住鸞鳥去日暮啁啾燕雀飛嗟哉劉生失所投不住泰山徂徠依經年採掇不得飽正是新春癭瘠歸明復先生居泰山久旱風伯且須戢頭角放出龍喙萬文長喙垂一尺雨一丈得雨萬丈成豐穰永伯仲淵在獄作此以傷之吁嗟惡獸羣蹄踏麒麟如死麏吁嗟惡鳥啅噪鳯凰伏中林我願爪牙如鋒鍔牙可噬爪可搏直入深山驅虎狼護取麒麟好頭角又願身生兩羽翼一夕長就萬丈長直入林中護鳯凰不使毛羽膚寸傷吾願兩未遂中夜涕沾裳送進士髙拱辰韓門有李漢栁氏得晦之其道卒無患二子為藩籬吾才誠駑弱十年空孜孜韓閫與栁閾豈敢輒潛窺二氏方肆行斯文日巳衰手持萬丈斧欲往斷其枝以次及根柢使不復蕃滋髙生吾之壻乃肯從吾為示我文一編言辭不葳蕤趐羽雖尚短已堪摩尾箕氣力雖未全已能搏蛟螭吾日覺老大韓栁難企斯吾子年始壯勇若熊與羆李漢不足慕晦之當並馳讀韓文渺焉五帝上嘗觀二典辭煥乎三王間嘗觀二雅詩道德既淳厚聲光何葳蕤烈烈日精散閎閎雷聲施施焉如飛龍潛焉如蟠螭祖述兼憲章後世惟吾師永言二帝往羣言或隳離亦既二雅末六義多凌遲寥寥千餘年顛危誰扶持揭揭韓先生雄雄周孔姿披榛啓其途與古相追馳沿波窮其源與道相濱涯三墳言其大十翼暢其微先生書之辭包括無孑遺春秋一王法曲禮三千儀先生載於筆巨細成羈縻楊墨乃淪胥曠然彰其媸佛老亦顛躋茫然復於夷婉婉平蔡畫淮西獲以依凌凌逐鱷文潮民蒙其禧將無造化合功與天地齊洋洋治世音磊磊王化基悖之則幽厲順之則軒羲徂徠集卷三
